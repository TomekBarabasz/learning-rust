[package]
name = "focus-watchdog"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", features = ["image", "gif", "webp"] }
image = { version = "0.25", features = ["gif", "webp", "png"] }
chrono = "0.4"
rfd = "0.17"
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0.229", features = ["derive"] }
anyhow = "1.0.104"
toml = "1.1.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 2
strip = true
