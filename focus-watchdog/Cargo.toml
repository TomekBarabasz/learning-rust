[package]
name = "focus-watchdog"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.36"
egui_extras = { version = "0.36", features = ["image", "gif", "webp"] }
image = { version = "0.25", features = ["gif", "webp"] }
chrono = "0.4"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 2
strip = true
